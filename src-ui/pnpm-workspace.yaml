packages:
  - "."
minimumReleaseAge: 10070
trustPolicy: no-downgrade
trustPolicyExclude:
  - "chokidar@4.0.3"
  - "semver@6.3.1 || 5.7.2"
blockExoticSubdeps: false
autoInstallPeers: false
allowBuilds:
  "@parcel/watcher": false
  canvas: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  normalize-diacritics: false
  unrs-resolver: false
onlyBuiltDependencies:
  - "@parcel/watcher"
  - canvas
  - esbuild
  - lmdb
  - msgpackr-extract
ignoredBuiltDependencies:
  - normalize-diacritics
  - unrs-resolver
overrides:
  "vite@>=8.3.0 <8.3.3": "^8.3.3"
  "zod@<4.6.6": "^4.6.6"
